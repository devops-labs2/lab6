global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: flask-app
    static_configs:
      - targets: ["app:5000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
